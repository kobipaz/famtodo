name: Notifications
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q firebase-admin==6.5.0
      - run: python scripts/notify.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
